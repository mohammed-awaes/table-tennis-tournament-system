{% extends "base.html" %}

{% block content %}
<h4>Players List</h4>

<table class="table table-bordered mt-3">
  <thead>
    <tr>
      <th>id</th>
      <th>Name</th>
      <th>Points</th>
    </tr>
  </thead>
  <tbody>
  {% for player in players %}
    <tr>
      <td>{{ player[0] }}</td>
      <td>{{ player[1] }}</td>
      <td>{{ player[2] }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
