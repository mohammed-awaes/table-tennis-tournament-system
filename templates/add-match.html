{% extends "base.html" %}

{% block content %}
<div class="card p-4">

  <form>
    <input type="text" class="form-control mb-2" placeholder="Player 1">
    <input type="text" class="form-control mb-2" placeholder="Player 2">

  </form>
</div>
{% endblock %}
