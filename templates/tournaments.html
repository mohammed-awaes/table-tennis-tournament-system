{% extends "base.html" %}

{% block content %}

<h4>Tournaments</h4>

<table class="table table-bordered mt-3">
  <thead>
    <tr>
      <th>Name</th>
      <th>Date</th>
      <th>Status</th>
      <th>Details</th>
    </tr>
  </thead>

  <tbody>
    {% for t in tournaments %}
    <tr>
      <td>{{ t[1] }}</td>
      <td>{{ t[2] }}</td>
      <td>
        {% if t[3] == 'finished' %}
          <span style="color:green">Finished</span>
        {% else %}
          <span style="color:orange">Ongoing</span>
        {% endif %}
      </td>
      <td>
        <a href="/tournament/{{ t[0] }}" class="btn btn-dark btn-sm">
          View
        </a>
      </td>
    </tr>
    {% endfor %}
  </tbody>

</table>

{% endblock %}
